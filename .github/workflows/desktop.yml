name: Desktop CI and preview releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            executable: release-native/mac-arm64/ChatStudio.app/Contents/MacOS/ChatStudio
            bundle: release-native/mac-arm64/ChatStudio.app/Contents/Resources/native
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            executable: release-native/linux-unpacked/chatstudio
            bundle: release-native/linux-unpacked/resources/native
          - os: windows-2022
            platform: win
            arch: x64
            executable: release-native/win-unpacked/ChatStudio.exe
            bundle: release-native/win-unpacked/resources/native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install Linux sandbox and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep xvfb libfuse2t64 patchelf libgomp1
          # GitHub's disposable runner must permit bubblewrap's user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install macOS sandbox dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: npm ci
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Assemble self-contained native runtime
        run: npm run setup:bundle
      - name: Provision Windows sandbox on disposable CI runner
        if: runner.os == 'Windows'
        run: node --input-type=module -e "import {installWindowsSandbox,getSrtWinPath} from '@carderne/sandbox-runtime'; import {execFileSync} from 'node:child_process'; const r=installWindowsSandbox(); if(r.cancelled || !r.user.provisioned) throw new Error('Windows sandbox provisioning failed'); console.log(execFileSync(getSrtWinPath(),['exec','--quiet','--','C:/Windows/System32/whoami.exe'],{cwd:'C:/Windows',timeout:120000,encoding:'utf8'}))"
      - name: Require tag to match package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if (process.env.TAG !== 'v' + require('./package.json').version) throw new Error('Tag must match package.json version')"
      - run: npm run typecheck
      - run: npm test
        env:
          CHATSTUDIO_SANDBOX_HELPERS: ${{ github.workspace }}/.runtime/bundle/sandbox
      - name: Verify native Measures and EnergyPlus under confinement
        run: npm run test:bundle
        env:
          CHATSTUDIO_SANDBOX_HELPERS: ${{ github.workspace }}/.runtime/bundle/sandbox
      - run: npm run build
      - name: Verify provider requests on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:provider
        env:
          DEBUG: pw:browser
      - name: Verify provider requests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:provider
        env:
          DEBUG: pw:browser
      - name: Build unsigned self-contained installers
        run: npx electron-builder --config electron-builder.native.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke-test packaged app
        if: runner.os != 'Linux'
        run: npm run test:package
        env:
          CHATSTUDIO_EXECUTABLE: ${{ matrix.executable }}
          CHATSTUDIO_EXPECT_BUNDLE: "1"
      - name: Smoke-test packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
        env:
          CHATSTUDIO_EXECUTABLE: release-native/linux-unpacked/chatstudio
          CHATSTUDIO_EXPECT_BUNDLE: "1"
      - name: Verify native execution from packaged resources
        run: node scripts/test-native-paths.mjs
        env:
          CHATSTUDIO_BUNDLE: ${{ github.workspace }}/${{ matrix.bundle }}
          CHATSTUDIO_SANDBOX_HELPERS: ${{ github.workspace }}/${{ matrix.bundle }}/sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: ChatStudio-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-native/*.dmg
            release-native/*.zip
            release-native/*.exe
            release-native/*.AppImage
            release-native/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create checksums and draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          gh release create "$TAG" ./* --verify-tag --draft --prerelease \
            --title "ChatStudio $TAG — self-contained native preview" \
            --notes "Unsigned self-contained installers for macOS Apple Silicon, Windows x64, and Ubuntu 24.04-compatible Linux x64. OpenStudio SDK/CLI, EnergyPlus, Python, embedded Ruby/gems, Common/ComStock Measures and ripgrep are included; gbXML assets are omitted. Linux also includes Bubblewrap and socat (kernel user namespaces must be enabled). Windows uses pi-sandbox's alpha runtime backend and requires one-time administrator/UAC setup in Settings. These are not signed/notarized production distributions. See README for setup and limitations."
