appId: org.chatstudio.desktop
productName: ChatStudio
asar: false
icon: assets/chatstudio-logo.png
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - LICENSE
  - assets/chatstudio-logo.png
  - "!node_modules/**/{test,tests,__tests__,example,examples}/**"
artifactName: ChatStudio-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  identity: null
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Science
  target:
    - AppImage
    - deb
